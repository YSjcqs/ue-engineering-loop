name: skill-quality

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      automation_release:
        description: "Require a complete Automation Profile catalog"
        required: false
        default: false
        type: boolean

jobs:
  core-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate skill structure
        run: python scripts/validate_skill.py
      - name: Run unit and subprocess contract tests
        run: python -m unittest discover -s tests -v

  windows-powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse production PowerShell scripts with Windows PowerShell
        shell: powershell
        run: |
          $errors = @()
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  automation-release:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_release }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Require complete Automation Profile provenance
        run: python scripts/validate_skill.py --release
